name: cloud-dorify-ui

services:
  app:
    image: dorify/app:dev
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      target: runtime
      args:
        VITE_APP_ENV: development
        VITE_DORIFY_DEPLOYMENT_MODE: cloud
        VITE_PUBLIC_TRACKING_URL: ${PUBLIC_TRACKING_URL:-http://localhost:58080}
    restart: unless-stopped
    ports:
      - '127.0.0.1:58080:8080'
    networks:
      - dorify-cloud-network

networks:
  dorify-cloud-network:
    external: true
