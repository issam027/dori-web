name: dorify-ui

services:
  app:
    image: dorify/app:dev
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - dorify-network

networks:
  dorify-network:
    external: true
